version: "3"

vars:
  G_ZSTD_OUTPUT_DIR: "{{.G_DEPS_DIR}}/zstd-src"

tasks:
  default:
    desc: "Download all dependencies."
    run: "once"
    cmds:
      - "rm -rf '{{.G_DEPS_CMAKE_SETTINGS_DIR}}'"
      - "mkdir -p '{{.G_DEPS_CMAKE_SETTINGS_DIR}}'"
      - task: ":utils:cmake:install-deps-and-generate-settings"
        vars:
          CMAKE_SETTINGS_DIR: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}"
          CMAKE_SETTINGS_FILE: "{{.G_DEPS_CMAKE_SETTINGS_FILE}}"
          DEP_TASK: "deps:download-all"

  download-all:
    internal: true
    deps:
      - "generate-zstd-single-file-lib"

  download-zstd:
    internal: true
    vars:
      LIB_NAME: "zstd"
    run: "once"
    cmds:
      - task: ":utils:remote:download-and-extract-tar"
        vars:
          FILE_SHA256: "37d7284556b20954e56e1ca85b80226768902e2edabd3b649e9e72c0c9012ee3"
          OUTPUT_DIR: "{{.G_ZSTD_OUTPUT_DIR}}"
          URL: "https://github.com/facebook/zstd/archive/refs/tags/v1.5.7.tar.gz"

  generate-zstd-single-file-lib:
    internal: true
    vars:
      LIB_NAME: "zstd-single-file"
      ZSTD_SINGLE_FILE_CMAKE_FILE: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}/{{.LIB_NAME}}.cmake"
      ZSTD_SINGLE_FILE_OUTPUT_DIR: "{{.G_DEPS_DIR}}/zstd-single-file"
      ZSTD_SINGLE_FILE_OUTPUT_FILE: "{{.ZSTD_SINGLE_FILE_OUTPUT_DIR}}/zstddeclib.c"
    sources:
      - "{{.G_DEPS_DIR}}/zstd-src/lib/**/*.c"
      - "{{.G_DEPS_DIR}}/zstd-src/lib/**/*.h"
    generates:
      - "{{.ZSTD_SINGLE_FILE_CMAKE_FILE}}"
      - "{{.ZSTD_SINGLE_FILE_OUTPUT_FILE}}"
    deps:
      - "download-zstd"
    cmds:
      - "mkdir -p '{{.G_DEPS_DIR}}/zstd-single-file'"
      - |-
        cd {{.G_ZSTD_OUTPUT_DIR}}/build/single_file_libs
        python3 combine.py \
        -r ../../lib -x legacy/zstd_legacy.h \
        -o {{.ZSTD_SINGLE_FILE_OUTPUT_FILE}} \
        zstddeclib-in.c
      - >-
        echo "set(
        ZSTD_DECOMPRESSOR_ZSTD_SINGLE_FILE_SOURCE_DIRECTORY \"{{.ZSTD_SINGLE_FILE_OUTPUT_DIR}}\"
        )" > "{{.ZSTD_SINGLE_FILE_CMAKE_FILE}}"