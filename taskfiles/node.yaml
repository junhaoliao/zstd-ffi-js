version: "3"

tasks:
  clean-node-modules:
    cmds:
      - "rm -f {{.G_NODE_MODULES_CHECKSUM}}"
      - "rm -rf '{{.ROOT_DIR}}/node_modules'"

  node-modules:
    vars:
      CHECKSUM_FILE: "{{.G_NODE_MODULES_CHECKSUM}}"
      OUTPUT_DIR: "{{.ROOT_DIR}}/node_modules"
    sources:
      - "package.json"
      - "package-lock.json"
      - "{{.ROOT_DIR}}/Taskfile.yml"
      - "{{.TASKFILE}}"
    generates:
      - "{{.G_NODE_MODULES_CHECKSUM}}"
    deps:
      - task: ":utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - task: "clean-node-modules"
      - "npm clean-install"
      # This command must be last
      - task: ":utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.ROOT_DIR}}/node_modules"]
